  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;display:flex;flex-direction:column;font-family:sans-serif}
    .header{background:linear-gradient(135deg,#e53935,#ff8f00);color:#fff;text-align:center;padding:10px;font-size:16px;font-weight:bold}
    .header small{font-size:11px;display:block;opacity:.9}
    #map{flex:1}
    .legend{background:rgba(0,0,0,.8);color:#fff;padding:6px;font-size:11px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .legend span{display:flex;align-items:center;gap:3px}
    .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
    .custom-marker{border-radius:50%;border:2px solid #fff;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer;font-size:9px;line-height:1;text-align:center}
  </style>
</head>

  <span><span class="dot" style="background:#43a047"></span>体験</span>

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{
  attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
  maxNativeZoom:17,
  maxZoom:21,
  tileSize:256
}).addTo(map);

function mk(lat,lng,num,name,info,type){
  var c={food:'#e53935',shop:'#1e88e5',exp:'#43a047',special:'#8e24aa',facility:'#ff8f00'}[type]||'#888';
  var s=type==='facility'?24:20;
  var icon=L.divIcon({className:'',html:'<div class="custom-marker" style="width:'+s+'px;height:'+s+'px;background:'+c+';">'+num+'</div>',iconSize:[s,s],iconAnchor:[s/2,s/2]});
  L.marker([lat,lng],{icon:icon}).bindPopup('<b>'+num+'. '+name+'</b><br>'+info).addTo(map);
}
